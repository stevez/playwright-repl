name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: nm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and type check (with sourcemaps for coverage)
        run: pnpm run build:dev

      - name: Lint extension
        run: pnpm run lint
        working-directory: packages/extension

      - name: Run tests
        run: pnpm -r run test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            packages/core/dist/
            packages/cli/dist/
            packages/mcp/dist/
            packages/runner/dist/
            packages/extension/dist/
            packages/vscode/dist/
          retention-days: 1

  extension-tests:
    name: extension (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: nm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: packages

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium chrome
        working-directory: packages/extension

      - name: Run extension component tests
        run: pnpm run test:component
        working-directory: packages/extension

      - name: Run extension E2E tests
        run: pnpm exec playwright test
        working-directory: packages/extension

      - name: Merge extension coverage
        run: pnpm run coverage:merge
        working-directory: packages/extension

  cli-e2e:
    name: cli-e2e (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: nm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: packages

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium chrome
        working-directory: packages/cli

      - name: Run CLI E2E tests
        run: node dist/playwright-repl.js --headless --replay examples/
        working-directory: packages/cli

  vscode-tests:
    name: vscode (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: nm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: packages

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium chrome
        working-directory: packages/vscode

      - name: Run VS Code extension mock tests
        run: pnpm exec playwright test --config tests/playwright/playwright.config.ts --project default
        working-directory: packages/vscode
        timeout-minutes: 10

      - name: Merge VS Code extension coverage
        run: pnpm run coverage:merge
        working-directory: packages/vscode

      # VS Code E2E tests disabled — flaky on CI, works locally
